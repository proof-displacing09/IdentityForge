# IdentityForge — OAuth/OIDC Authentication Attack Laboratory
#
# Localhost-only lab orchestration. All published ports bind to 127.0.0.1.
# Nothing in this file is suitable for remote/production deployment: local
# HTTP is an explicitly labelled development exception (see README.md and
# docs/VALIDATION_AND_LIMITATIONS.md).
#
# Start:  docker compose up --build -d
# Stop:   docker compose down
# Reset:  ./scripts/reset.sh --confirm   (destroys synthetic volumes only)
#
# Keycloak image pin: quay.io/keycloak/keycloak:26.8.2
#   Tag verified to exist 2026-11-10 (released 2026-11-05; 33 CVE fixes,
#   including critical SAML signature bypass CVE-2026-117691 — the lab
#   uses no SAML, but 26.8.2 is the supported line and 26.2 is not).
#
# Networking (Operation Trustline ADR, docs/KEYCLOAK_INTEGRATION.md):
#   - App processes bind 0.0.0.0 INSIDE their containers so published
#     ports can reach them; host-published ports stay 127.0.0.1-only.
#   - Canonical issuer (browser + tokens): http://127.0.0.1:8080/...
#   - Backend transport route to Keycloak: keycloak:8080
#     (service DNS within the private Compose bridge — never
#     substituted for the issuer identity).
#   - No fixed container_name values: Compose names containers from
#     the project name, so `docker compose -p <disposable> up` (the
#     cold-start gate, scripts/test-all.sh) can run alongside — or
#     instead of — the user's own stack without name collisions.
#     Volumes are project-prefixed the same way.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command:
      - start-dev
      - --import-realm
    environment:
      # Hostname v2 (Keycloak 26.x): hostname values are FULL URLs
      # including scheme and port. Bare hosts (KC_HOSTNAME=127.0.0.1)
      # and the v1 KC_HOSTNAME_PORT option are rejected / deprecated:
      # 26.8.2 fails boot with "Provided hostname-admin is not a valid
      # URL" and warns "Hostname v1 options [hostname-port] are still
      # in use". Verified live 2026-11-10 (see docs/KEYCLOAK_INTEGRATION.md).
      KC_HOSTNAME: "http://127.0.0.1:8080"
      KC_HOSTNAME_ADMIN: "http://127.0.0.1:8080"
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: dev-file
    ports:
      # Canonical ports are FIXED for this lab (P1-14): 8080 is part of
      # the issuer identity, so a published-port override would break
      # login. If 8080 is in use, stop the conflicting service.
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-import:/opt/keycloak/data/import:ro
    healthcheck:
      # P1-15: requires BOTH an HTTP 200 status line AND the "issuer"
      # field in the discovery body — a bare grep for "issuer" could
      # pass on a stale/error body. Requires bash, /dev/tcp and grep
      # inside the keycloak:26.8.2 image.
      # IF-V4-01 (v5, P0): the in-container shell variable is written
      # '$$resp', NOT '$resp'. Docker Compose interpolates $VAR and
      # ${VAR} in configuration values BEFORE the container shell
      # runs, so a single-dollar '$resp' was replaced by an empty
      # string and the healthcheck inspected blank text (expected to
      # fail, blocking backend/frontend via depends_on service_healthy
      # despite a healthy Keycloak JVM). '$$' is Compose's escape for
      # a literal dollar sign, so the container shell receives the
      # intended 'resp=$(cat <&3)' / 'echo "$resp"'. The '$(cat ...)'
      # form is NOT interpolated: '(' cannot begin a Compose variable
      # name, so it passes through unchanged. Static regression:
      # scripts/compose-config-check.py simulates Compose
      # interpolation and asserts the resolved command still contains
      # the literal '$resp' references; scripts/test-compose-healthcheck.sh
      # additionally checks the RESOLVED command via
      # 'docker compose config' and (with Docker) the live health
      # state. SOURCE FIXED; ACTUAL DOCKER HEALTHCHECK + COMPOSE BOOT
      # NOT RUN in the build sandbox (no Docker there).
      # In-image reviewer probe on a running stack:
      #   docker compose exec keycloak bash -c 'command -v bash grep; exec 3<>/dev/tcp/127.0.0.1/8080 && echo TCP_OK'
      # If bash/grep are absent from the pinned image, replace this
      # healthcheck with a supported readiness probe — do not weaken
      # it to a bare TCP connect (that cannot prove discovery works).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/identityforge-lab/.well-known/openid-configuration HTTP/1.1\\r\\nHost: 127.0.0.1:8080\\r\\nConnection: close\\r\\n\\r\\n' >&3 && resp=$(cat <&3) && echo \"$$resp\" | grep -qE 'HTTP/1\\.[01] 200' && echo \"$$resp\" | grep -q '\"issuer\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - identityforge-net

  # IF-V8-42 (v8.0.5) — one-shot evidence-volume preparation.
  # A named volume created by an earlier (root-run) release holds a
  # root-owned SQLite DB that the non-root backend (UID 10001) could
  # not write, and an image-side chown cannot survive a volume mount
  # (the mount replaces /app/data). This service is the ONLY root
  # process in the lab, and it is deliberately narrow:
  #   * it reuses the backend image (which ships the stdlib-only
  #     backend/docker/prepare-data-volume.py) with an explicit
  #     `user: "0:0"` override — the app image itself NEVER runs as
  #     root (its Dockerfile ends `USER 10001:10001`, no `USER root`);
  #   * it mounts ONLY backend_data — no other volume, no host path,
  #     no ports, no network services;
  #   * the script touches ONLY /app/data (scope guard: the path
  #     must resolve inside /app; no symlinks followed, no recursion
  #     below the top level, modes tightened to 0750/0640, never
  #     loosened, nothing deleted or replaced — existing rows are
  #     preserved and a read-only integrity probe runs when a DB
  #     is present);
  #   * it exits after preparing; the backend starts ONLY when this
  #     service exits 0 (depends_on service_completed_successfully
  #     below). Any failure exits non-zero with a precise message
  #     and the backend never starts — fail-closed, no silent
  #     fallback to a root app runtime.
  # Fresh volumes, existing root-owned volumes, and already-correct
  # volumes (idempotent no-op) are all handled; a corrupt DB, a
  # file/symlink where the directory belongs, or an unwritable
  # volume fails the boot with the reason in `docker compose logs
  # backend-data-prep`. Keycloak's volume is never touched here.
  backend-data-prep:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: "0:0"
    command: ["python3", "/app/prepare-data-volume.py", "--data-dir", "/app/data", "--uid", "10001", "--gid", "10001"]
    volumes:
      - backend_data:/app/data
    networks:
      - identityforge-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      IDENTITYFORGE_ISSUER: http://127.0.0.1:8080/realms/identityforge-lab
      IDENTITYFORGE_IDP_TRANSPORT_BASE: http://keycloak:8080
      IDENTITYFORGE_CLIENT_ID: campus-club-portal
      IDENTITYFORGE_REDIRECT_URI: http://127.0.0.1:8000/auth/callback
      IDENTITYFORGE_FRONTEND_URL: http://127.0.0.1:5173
      IDENTITYFORGE_ENV: lab
      # IF-V7.1-01 (v7.2): disposable-project attestation marker. The
      # -Full runners set this to a fresh UUID per run (see
      # scripts/test-all.sh / test-all.ps1); the backend reports it via
      # GET /api/v1/lab/status ONLY when set, and live-gate.py reset
      # refuses to run unless its --disposable-project-id flag matches
      # the value the backend itself reports. Unset (persistent lab):
      # no marker, no reset. A random UUID, NOT a secret or token.
      IDENTITYFORGE_DISPOSABLE_PROJECT_ID: ${IDENTITYFORGE_DISPOSABLE_PROJECT_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      keycloak:
        condition: service_healthy
      # IF-V8-42: the backend must not start until the one-shot
      # volume prep has made /app/data writable by UID 10001
      # (fresh volume, existing root-owned volume, or no-op).
      backend-data-prep:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - identityforge-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - identityforge-net

volumes:
  # Synthetic Keycloak data only (realm, synthetic users, test sessions).
  # No real identity data is ever stored here. `reset.sh --confirm` removes it.
  keycloak_data:
  # Backend evidence DB (redacted scenario runs). Persisted so reports
  # survive a container restart; `reset.sh --confirm` removes it.
  backend_data:

networks:
  identityforge-net:
    driver: bridge
    internal: false
