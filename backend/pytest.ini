[pytest]
testpaths = tests
pythonpath = src
addopts = -q
# live_keycloak (v8.0.2, IF-V8.0.2-B): tests that require a live Keycloak
# provider on 127.0.0.1:8080 (real OIDC discovery / login-start). The
# four marked tests fail with 503 PROVIDER_UNAVAILABLE when no provider
# runs, so the offline selection is `-m "not live_keycloak"` (default CI
# backend lane, test-all.sh --offline, verify-release BACKEND_PYTEST)
# and the marked tests run only in the full profile
# (`-m live_keycloak`, test-all.sh --full gate LIVE_PROVIDER_PYTEST).
# NOTE: this file is the effective pytest config — pytest.ini takes
# precedence over the [tool.pytest.ini_options] section in
# backend/pyproject.toml, which is shadowed and carries no markers.
# Keep the two in agreement if the pyproject section is ever revived.
markers =
    live_keycloak: requires a live Keycloak provider on 127.0.0.1:8080 (real discovery/login-start); excluded from the offline selection
